services:
  frontend:
    container_name: devlaunch-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DEVLAUNCH_AGENT_URL: http://host.docker.internal:47821
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - npm

networks:
  npm:
    external: true
